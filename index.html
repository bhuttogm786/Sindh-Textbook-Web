<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sindh Textbook Web</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #0b5d3b;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 27px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 15px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px 15px;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      text-align: center;
    }

    .welcome h2 {
      color: #0b5d3b;
      margin-bottom: 10px;
    }

    .classes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .class-card {
      background: white;
      border-radius: 15px;
      padding: 25px 10px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .class-card a {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .class-card h3 {
      color: #0b5d3b;
      font-size: 22px;
      margin-bottom: 8px;
    }

    .class-card p {
      color: #666;
      font-size: 14px;
    }

    footer {
      margin-top: 30px;
      padding: 20px;
      text-align: center;
      background: #0b5d3b;
      color: white;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>📚 Sindh Textbook Web</h1>
  <p>Sindh Textbook Board Educational Platform</p>
</header>

<main class="container">

  <section class="welcome">
    <h2>Welcome Students</h2>
    <p>Classes 9 to 12 — Books, Subjects, Notes and Quizzes</p>
  </section>

  <section class="classes">

    <div class="class-card">
      <a href="https://drive.google.com/drive/folders/1exic8v1XsRdPQW6SvPJieZmiLRoWYN2d" target="_blank">
        <h3>Class 9</h3>
        <p>Books & Subjects</p>
      </a>
    </div>

    <div class="class-card">
      <a href="https://drive.google.com/drive/folders/1hqkfpuxvSwMlzd25E22kI2PrrfiWYiyh" target="_blank">
        <h3>Class 10</h3>
        <p>Books & Subjects</p>
      </a>
    </div>

    <div class="class-card">
      <a href="https://drive.google.com/drive/folders/1f3HRFRAOxEq5FWUUMqIFBRj_Zk6hE3fY" target="_blank">
        <h3>First Year</h3>
        <p>Class 11 — Books & Subjects</p>
      </a>
    </div>

    <div class="class-card">
      <a href="https://drive.google.com/drive/folders/17RImwQ9yBH9WR2_s1AyBA3BoeMWy-X6v" target="_blank">
        <h3>Second Year</h3>
        <p>Class 12 — Books & Subjects</p>
      </a>
    </div>

  </section>

</main>

<footer>
  Sindh Textbook Web © 2026
</footer>

</body>
</html>
